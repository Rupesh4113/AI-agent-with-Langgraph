services:
  ai-research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_research_agent
    ports:
      - "8501:8501"
    environment:
      - MODEL_PROVIDER=${MODEL_PROVIDER:-mock}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
      - TEMPERATURE=${TEMPERATURE:-0.2}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MAX_RESEARCH_ITERATIONS=${MAX_RESEARCH_ITERATIONS:-3}
      - MIN_CONFIDENCE_THRESHOLD=${MIN_CONFIDENCE_THRESHOLD:-0.80}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-ai-research-agent}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
